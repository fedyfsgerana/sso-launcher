<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Demo — SSO Launcher</title>
    <meta
      name="description"
      content="Demo interaktif SSO Launcher: login sekali, buka semua aplikasi. Data contoh tersimpan di browser."
    />
    <link rel="icon" href="{{LOGO}}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          if (localStorage.getItem("sso-demo-theme") === "dark")
            document.documentElement.dataset.theme = "dark";
        } catch {}
      })();
    </script>
    <style>
      :root {
        --font-geist-sans: "Geist";
        --font-geist-mono: "Geist Mono";
      }
      /* APP_CSS */
      .demo-bar {
        position: relative;
        z-index: 45;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 4px 14px;
        padding: 7px 16px;
        background: var(--g900);
        color: #fff;
        font-size: 12.5px;
        line-height: 18px;
      }
      .demo-bar button,
      .demo-bar a {
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        font: inherit;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .demo-accounts {
        display: grid;
        gap: 6px;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        text-align: left;
      }
      .demo-accounts h2 {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        margin: 0 0 2px;
      }
      .demo-account {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        color: var(--body);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .demo-account:hover {
        border-color: var(--g600);
      }
      .demo-account b {
        display: block;
        font-weight: 600;
        color: var(--ink);
        font-size: 13px;
      }
      .demo-account small {
        color: var(--muted);
        font-size: 12px;
      }
      .demo-app {
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
      }
      .demo-app-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 24px;
        color: #fff;
      }
      .demo-app-bar b {
        font-size: 16px;
      }
      .demo-app-bar small {
        opacity: 0.8;
      }
      .demo-app-bar .demo-app-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .demo-app-bar .demo-app-brand > span {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.18);
      }
      .demo-app-bar button {
        border: 1px solid rgba(255, 255, 255, 0.5);
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border-radius: 10px;
        padding: 8px 14px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        gap: 8px;
        align-items: center;
      }
      .demo-app-body {
        max-width: 920px;
        margin: 0 auto;
        padding: 28px 20px 60px;
        display: grid;
        gap: 16px;
      }
      .demo-app-body .card {
        padding: 22px;
      }
      .demo-app-body h1 {
        margin: 0 0 6px;
        font-size: 22px;
      }
      .demo-app-body p {
        margin: 0;
        color: var(--body);
      }
      .demo-app-body pre {
        margin: 12px 0 0;
        padding: 14px;
        border-radius: 10px;
        background: var(--surface-sunken);
        border: 1px solid var(--line);
        overflow: auto;
        font-family: var(--font-mono);
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--ink-2);
      }
      .demo-steps {
        margin: 12px 0 0;
        padding-left: 20px;
        display: grid;
        gap: 6px;
        color: var(--body);
      }
      .demo-table td,
      .demo-table th {
        white-space: nowrap;
      }
      .lp {
        top: var(--demo-bar-h, 0px);
      }
      .sb {
        height: calc(100dvh - var(--demo-bar-left, 0px));
      }
      html[data-theme="dark"] .demo-bar {
        background: #0f2a20;
        color: #e6f2ec;
      }
      .demo-short {
        display: none;
      }
      @media (max-width: 680px) {
        .demo-bar {
          gap: 2px 12px;
          padding: 6px 12px;
          font-size: 12px;
        }
        .demo-long {
          display: none;
        }
        .demo-short {
          display: inline;
        }
      }
      .demo-still .main > .page,
      .demo-still .main > .page *,
      .demo-still .main > .page *::before,
      .demo-still .main > .page *::after {
        animation: none !important;
        transition: none !important;
      }
    </style>
  </head>
  <body>

      <span class="demo-long"
        >Mode demo: data contoh tersimpan di browser Anda, tanpa server.</span

      <b class="demo-short">Mode demo</b>
      <button type="button" data-act="theme">
        <span class="demo-long">Ganti tema terang/gelap</span
        ><span class="demo-short">Tema</span>
      </button>
      <button type="button" data-act="reset">
        <span class="demo-long">Atur ulang data demo</span
        ><span class="demo-short">Atur ulang</span>
      </button>
      <a href="https://github.com/fedyfsgerana/sso-launcher"
        ><span class="demo-long">Kode sumber di GitHub</span
        ><span class="demo-short">GitHub</span></a
      >
    </div>
    <div id="root"></div>
    <div id="layer"></div>
    <div id="toast-root"></div>

        const SELECTS = {};
        function tsel(id, value, options, ariaLabel, onChange) {
          SELECTS[id] = { value, options, onChange };
          const selected = options.find((o) => o.value === value);
          return `<div class="seg-select"><button type="button" class="ts-control filter${selected ? "" : " is-placeholder"}" aria-label="${esc(ariaLabel)}" aria-haspopup="listbox" aria-expanded="false" data-ts="${id}"><span class="ts-val">${esc(selected ? selected.label : "Pilih opsi")}</span>${icon("chevronDown", 16)}</button></div>`;
        }

        function dataPager(key, total, page, size, sizes, unit, summary = "") {
          const pages = Math.max(1, Math.ceil(total / size));
          const current = Math.min(page, pages);
          const start = total === 0 ? 0 : (current - 1) * size + 1;
          const end = Math.min(current * size, total);
          const numbers = [];
          for (let n = 1; n <= pages; n += 1) {
            if (
              pages <= 7 ||
              n === 1 ||
              n === pages ||
              Math.abs(n - current) <= 1
            )
              numbers.push(n);
            else if (numbers[numbers.length - 1] !== "gap") numbers.push("gap");
          }
          const sizeSelect = tsel(
            `size-${key}`,
            String(size),
            sizes.map((s) => ({ value: String(s), label: `${s} per halaman` })),
            "Jumlah per halaman",
            (v) => setPage(key, { size: Number(v), page: 1 }),
          );
          return `<div class="pager">${summary || `<span class="muted">${total === 0 ? "Tidak ada data" : `Menampilkan ${start}–${end} dari ${total} ${unit}`}</span>`}<div class="pager-r">${summary && total > 0 ? `<span class="muted">${start}–${end} dari ${total}</span>` : ""}${sizeSelect}<nav class="pages" aria-label="Halaman"><button type="button" aria-label="Sebelumnya" ${current === 1 ? "disabled" : ""} data-page="${key}:${current - 1}">${icon("chevronLeft", 16)}</button>${numbers.map((n) => (n === "gap" ? "<span>…</span>" : `<button type="button" class="${n === current ? "on" : ""}" ${n === current ? 'aria-current="page"' : ""} data-page="${key}:${n}">${n}</button>`)).join("")}<button type="button" aria-label="Berikutnya" ${current === pages ? "disabled" : ""} data-page="${key}:${current + 1}">${icon("chevronRight", 16)}</button></nav></div></div>`;
        }
        function setPage(key, patch) {
          if (
            (key === "us" || key === "gr") &&
            ("page" in patch || "size" in patch)
          )
            ui[key].sel = [];
          Object.assign(ui[key], patch);
          render();
        }
        const pageSlice = (list, state) => {
          const pages = Math.max(1, Math.ceil(list.length / state.size));
          state.page = Math.min(state.page, pages);
          return list.slice(
            (state.page - 1) * state.size,
            state.page * state.size,
          );
        };

        const TILE_MIN = 100,

          const columns = state.cols[key];

              : `<button class="ov-tile${a.status !== "active" ? " ov-disabled" : ""}${a.status === "maintenance" ? " ov-maintenance" : ""}" type="button" data-open="${a.id}"${tipAttr(a)}><span class="ov-tileIcon"><span class="ov-logo ${a.color}">${icon(a.icon, 24)}</span>${dot(a)}</span><b class="ov-tileName">${esc(a.name)}</b><small class="ov-tileMeta">${esc(a.category || a.description)}</small></button>`;
          return `<div class="${view === "list" ? "ov-listGrid" : "ov-pagerGrid"}" style="--columns:${columns}" data-grid="${key}">${shown.map(item).join("")}</div>
      <footer class="ov-sectionFoot">${stack(apps, label)}<div class="ov-pagerNav"><span class="ov-pagerInfo">${start + 1}–${start + shown.length} dari ${apps.length}</span>
      <button class="ov-pagerButton ov-pagerPrev" type="button" aria-label="Halaman sebelumnya" ${current === 0 ? "disabled" : ""} data-tpage="${key}:-1">${icon("chevronLeft", 18)}</button>
      <button class="ov-pagerButton ov-pagerNext" type="button" aria-label="Halaman berikutnya" ${current >= pages - 1 ? "disabled" : ""} data-tpage="${key}:1">${icon("chevronRight", 18)}</button></div></footer>`;
        }

          document.querySelectorAll("[data-grid]").forEach((grid) => {

        const floatRoot = document.createElement("div");
        document.body.appendChild(floatRoot);
        let floating = null;
        function closeFloating() {
          if (!floating) return;
          floating.anchor.setAttribute("aria-expanded", "false");
          floating.anchor.classList.remove("is-open");
          floating = null;
          floatRoot.innerHTML = "";
        }
        function openRowMenu(anchor) {
          if (floating && floating.anchor === anchor) return closeFloating();
          closeFloating();
          const items = rowMenuItems(anchor.dataset.rowmenu);
          if (!items.length) return;
          ROW_MENUS.current = items;
          floatRoot.innerHTML = `<div class="menu-pop floating-menu" role="menu" style="width:210px;visibility:hidden">${items.map((item, index) => `<button class="mi row-menu-item ${item.tone}" type="button" role="menuitem" data-rowitem="${index}">${icon(item.icon, 17)}${esc(item.label)}</button>`).join("")}</div>`;
          const panel = floatRoot.firstElementChild;
          const rect = anchor.getBoundingClientRect();
          const height = panel.offsetHeight;
          const below = window.innerHeight - rect.bottom - 6 - 12;
          const openUp = below < height && rect.top > below;
          panel.style.top = `${openUp ? Math.max(12, rect.top - 6 - height) : Math.min(rect.bottom + 6, window.innerHeight - 12 - height)}px`;
          panel.style.left = `${Math.min(Math.max(12, rect.right - 210), window.innerWidth - 12 - 210)}px`;
          panel.style.visibility = "visible";
          anchor.setAttribute("aria-expanded", "true");
          anchor.classList.add("is-open");
          floating = { kind: "menu", anchor };
        }
        function openSelect(anchor) {
          if (floating && floating.anchor === anchor) return closeFloating();
          closeFloating();
          const config = SELECTS[anchor.dataset.ts];
          if (!config) return;
          const rect = anchor.getBoundingClientRect();
          const width = Math.max(rect.width, 220);
          const left = Math.min(
            Math.max(12, rect.left),
            Math.max(12, window.innerWidth - width - 12),
          );
          const spaceBelow = window.innerHeight - rect.bottom - 18;
          const spaceAbove = rect.top - 18;
          const above = spaceBelow < 200 && spaceAbove > spaceBelow;
          const maxHeight = Math.max(
            160,
            Math.min(360, above ? spaceAbove : spaceBelow),
          );
          const position = above
            ? `bottom:${window.innerHeight - rect.top + 6}px`
            : `top:${rect.bottom + 6}px`;
          floating = {
            kind: "select",
            anchor,
            config,
            query: "",
            cursor: Math.max(
              0,
              config.options.findIndex((o) => o.value === config.value),
            ),
          };
          floatRoot.innerHTML = `<div class="${above ? "ts-dropdown is-above" : "ts-dropdown"}" style="${position};left:${left}px;width:${width}px;max-height:${maxHeight}px"><div class="ts-search">${icon("search", 16)}<input placeholder="Cari pilihan" aria-label="Cari pilihan" data-ts-search></div><ul class="ts-list" role="listbox"></ul></div>`;
          anchor.classList.add("open");
          anchor.setAttribute("aria-expanded", "true");
          paintSelect();
          floatRoot.querySelector("[data-ts-search]").focus();
        }
        function selectOptions() {
          const keyword = floating.query.trim().toLocaleLowerCase("id-ID");
          return floating.config.options.filter(
            (o) =>
              !keyword || o.label.toLocaleLowerCase("id-ID").includes(keyword),
          );
        }
        function paintSelect() {
          const options = selectOptions();
          floating.cursor = Math.min(
            floating.cursor,
            Math.max(options.length - 1, 0),
          );
          floatRoot.querySelector(".ts-list").innerHTML = options.length
            ? options
                .map(
                  (o, index) =>
                    `<li role="option" aria-selected="${o.value === floating.config.value}" class="${[o.value === floating.config.value ? "sel" : "", index === floating.cursor ? "hi" : ""].filter(Boolean).join(" ")}" data-ts-option="${index}"><span>${esc(o.label)}</span>${o.value === floating.config.value ? icon("check", 15) : ""}</li>`,
                )
                .join("")
            : `<li class="ts-empty">Tidak ada pilihan</li>`;
        }
        function chooseSelect(index) {
          const option = selectOptions()[index];
          if (!option) return;
          const { config, anchor } = floating;
          anchor.classList.remove("open");
          closeFloating();
          if (option.value !== config.value) config.onChange(option.value);
        }

        function showMaintenanceTip(target) {

          tipTarget = target;
          tipTimer = setTimeout(
            () => {
              const a = db.apps.find(
                (x) => x.id === Number(target.dataset.mtip),
              );
              if (!a || !document.body.contains(target)) return;
              const rect = target.getBoundingClientRect();
              const below = rect.bottom + 100 < window.innerHeight;
              const left = Math.min(
                Math.max(rect.left + rect.width / 2, 120),
                window.innerWidth - 120,
              );
              tipRoot.innerHTML = `<div role="tooltip" class="hover-tip ${below ? "below" : "above"}" style="top:${below ? rect.bottom + 6 : rect.top - 6}px;left:${left}px"><b>${esc(a.name)}</b><span class="hover-tip-row warn">${icon("wrench", 13)}${esc(a.maintenanceMessage || "Sedang maintenance")}</span></div>`;
            },
            tipRoot.firstElementChild ? 0 : 120,
          );
        }
        function hideMaintenanceTip() {
          clearTimeout(tipTimer);
          tipTarget = null;
          const tip = tipRoot.firstElementChild;
          if (!tip) return;

            tipRoot.innerHTML = "";

        function countUp() {
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches)
            return;
          document.querySelectorAll("[data-count]").forEach((el) => {
            const target = Number(el.dataset.count);
            const start = performance.now();
            const step = (now) => {
              const progress = Math.min(1, (now - start) / 900);
              el.textContent = String(
                Math.round(target * (1 - Math.pow(1 - progress, 3))),
              );
              if (progress < 1) requestAnimationFrame(step);
            };
            el.textContent = "0";
            requestAnimationFrame(step);
          });
        }

        function toggleSort(state, key) {
          const current = state.sort;
          state.sort =
            !current || current.key !== key
              ? { key, direction: "asc" }
              : current.direction === "asc"
                ? { key, direction: "desc" }
                : null;
          state.page = 1;

        function sortRows(list, state, getters) {
          if (!state.sort || !getters[state.sort.key]) return list;
          const get = getters[state.sort.key];
          return [...list].sort((l, r) => {
            const a = get(l),
              b = get(r);
            const c =
              typeof a === "string" ? a.localeCompare(b, "id-ID") : a - b;
            return state.sort.direction === "asc" ? c : -c;

        const USER_DELETE_EFFECT =
          "Akunnya langsung dinonaktifkan, seluruh sesinya dicabut, dan aksesnya ke semua aplikasi berakhir.";
        const GROUP_ACCESS_LOSS =
          "langsung kehilangan menu dan aplikasi yang diberikan lewat grup ini.";
        const REASON = {
          withReason: true,
          reasonLabel: "Alasan penghapusan",
          reasonPlaceholder: "Masukkan alasan penghapusan",
        };

        function setUserActive(user, active) {
          user.active = active;
          audit(
            "update",
            "user",
            user.name,
            `Status diubah dari ${active ? "Nonaktif ke Aktif" : "Aktif ke Nonaktif"}`,
          );
        }
        function deleteUser(user, reason) {
          if (user.id === me.id) return false;
          user.deleted = true;
          user.active = false;
          audit(
            "delete",
            "user",
            user.name,
            `Dipindahkan ke tempat sampah. Alasan: ${reason}`,
          );
          return true;
        }
        function setGroupActive(group, active) {
          group.active = active;
          audit(
            "update",
            "user_group",
            group.name,
            `Status diubah dari ${active ? "Nonaktif ke Aktif" : "Aktif ke Nonaktif"}`,
          );
        }
        function deleteGroup(group, reason) {
          group.deleted = true;
          audit(
            "delete",
            "user_group",
            group.name,
            `Grup dipindahkan ke tempat sampah beserta ${memberCount(group)} anggota. Alasan: ${reason}`,
          );
          return true;
        }

        async function toggleUser(user) {
          const ok = await ask({
            title: user.active ? "Nonaktifkan pengguna?" : "Aktifkan pengguna?",
            message: user.active
              ? `${user.name} tidak akan bisa masuk sampai diaktifkan kembali.`
              : `${user.name} akan bisa masuk kembali ke SSO Launcher.`,
            confirmLabel: user.active ? "Nonaktifkan" : "Aktifkan",
            danger: user.active,
            icon: user.active ? "ban" : "circleCheck",
            tone: user.active ? "danger" : "success",
          });
          if (!ok) return;
          if (user.id === me.id && user.active) {
            render();
            return toast(
              "Akun yang sedang Anda pakai tidak bisa dinonaktifkan.",
              "error",
            );
          }
          const wasActive = user.active;
          setUserActive(user, !wasActive);
          render();
          toast(`${user.name} ${wasActive ? "dinonaktifkan" : "diaktifkan"}`);
        }
        async function removeUser(user) {
          const reason = await ask({
            title: "Hapus pengguna?",
            message: `${user.name} (${user.nik || user.email}) akan dihapus. ${USER_DELETE_EFFECT}`,
            confirmLabel: "Hapus",
            danger: true,
            icon: "trash",
            tone: "danger",
            ...REASON,
          });
          if (reason === null) return;
          const done = deleteUser(user, reason);
          ui.us.sel = ui.us.sel.filter((id) => id !== user.id);
          render();
          toast(
            done
              ? `${user.name} dihapus`
              : "Akun yang sedang Anda pakai tidak bisa dihapus.",
            done ? "success" : "error",
          );
        }
        async function toggleGroup(group) {
          const next = !group.active;
          const ok = await ask({
            title: next ? "Aktifkan grup?" : "Nonaktifkan grup?",
            message: next
              ? `Pengguna dalam grup "${group.name}" akan kembali mendapat akses dari grup ini.`
              : `Pengguna dalam grup "${group.name}" akan kehilangan menu dan aplikasi yang diberikan lewat grup ini.`,
            confirmLabel: next ? "Aktifkan" : "Nonaktifkan",
            danger: !next,
            icon: next ? "circleCheck" : "ban",
            tone: next ? "success" : "danger",
          });
          if (!ok) return;
          setGroupActive(group, next);
          render();
          toast(`Grup ${group.name} ${next ? "diaktifkan" : "dinonaktifkan"}`);
        }
        async function removeGroup(group) {
          const reason = await ask({
            title: "Hapus grup?",
            message: `Grup "${group.name}" akan dihapus. Pengguna di dalamnya ${GROUP_ACCESS_LOSS}`,
            confirmLabel: "Hapus",
            danger: true,
            icon: "trash",
            tone: "danger",
            ...REASON,
          });
          if (reason === null) return;
          deleteGroup(group, reason);
          ui.gr.sel = ui.gr.sel.filter((id) => id !== group.id);
          render();
          toast(`Grup ${group.name} dihapus`);
        }

        async function runBulk(scope, action) {
          const isUser = scope === "us";
          const noun = isUser ? "pengguna" : "grup";
          const source = isUser ? liveUsers() : liveGroups();
          const targets = source.filter((x) => ui[scope].sel.includes(x.id));
          if (!targets.length) return;
          const count = targets.length;
          let reason = "";
          if (action === "delete") {
            reason = await ask({
              title: `Hapus ${count} ${noun}?`,
              message: isUser
                ? `Pengguna terpilih akan dihapus. ${USER_DELETE_EFFECT}`
                : `Grup terpilih akan dihapus. Pengguna di dalamnya ${GROUP_ACCESS_LOSS}`,
              confirmLabel: "Hapus",
              danger: true,
              icon: "trash",
              tone: "danger",
              ...REASON,
            });
            if (reason === null) return;
          } else {
            const activate = action === "activate";
            const ok = await ask({
              title: `${activate ? "Aktifkan" : "Nonaktifkan"} ${count} ${noun}?`,
              message: isUser
                ? activate
                  ? "Pengguna terpilih akan bisa masuk kembali."
                  : "Pengguna terpilih tidak akan bisa masuk sampai diaktifkan kembali."
                : activate
                  ? "Pengguna dalam grup terpilih akan kembali mendapat akses dari grup itu."
                  : "Pengguna dalam grup terpilih akan kehilangan menu dan aplikasi yang diberikan lewat grup itu.",
              confirmLabel: activate ? "Aktifkan" : "Nonaktifkan",
              danger: !activate,
              icon: activate ? "circleCheck" : "ban",
              tone: activate ? "success" : "danger",
            });
            if (!ok) return;
          }
          let done = 0;
          for (const target of targets) {
            if (action === "delete") {
              if (
                isUser
                  ? deleteUser(target, reason)
                  : deleteGroup(target, reason)
              )
                done += 1;
              continue;
            }
            const active = action === "activate";
            if (isUser && target.id === me.id && !active) continue;
            if (target.active !== active)
              (isUser ? setUserActive : setGroupActive)(target, active);
            done += 1;
          }
          ui[scope].sel = [];
          render();
          const verb =
            action === "delete"
              ? "dihapus"
              : action === "activate"
                ? "diaktifkan"
                : "dinonaktifkan";
          if (done === count) toast(`${count} ${noun} ${verb}`);
          else
            toast(
              `${done} dari ${count} ${noun} ${verb}. Akun yang sedang Anda pakai dilewati.`,
              "warning",
            );
        }

        const PAD = (v) => String(v).padStart(2, "0");
        const MONTHS = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "Mei",
          "Jun",
          "Jul",
          "Agu",
          "Sep",
          "Okt",
          "Nov",
          "Des",
        ];
        const dayRel = (iso) => {
          const date = new Date(iso);
          const time = `${PAD(date.getHours())}:${PAD(date.getMinutes())}`;
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const target = new Date(date);
          target.setHours(0, 0, 0, 0);
          const diff = Math.round((today - target) / 864e5);
          if (diff === 0) return `Hari ini, ${time}`;
          if (diff === 1) return `Kemarin, ${time}`;
          return `${date.getDate()} ${MONTHS[date.getMonth()]} ${date.getFullYear()}, ${time}`;
        };
        const roleTag = (u) =>
          [u.code || u.department, u.job].filter(Boolean).join(" · ");
        const NOTICE_ICONS = {
          access_granted: "window",
          access_revoked: "shieldAlert",
          application_maintenance: "wrench",
          application_active: "circleCheck",
          new_device: "laptop",
          password_reset: "key",
          account_locked: "lock",
          user_locked: "lock",

        const myNotices = () =>
          (db.notifications || [])
            .filter((n) => n.userId === me.id)

        function popover() {
          if (!ui.pop) return "";
          const btn = document.querySelector(`[data-pop="${ui.pop}"]`);
          const r = btn
            ? btn.getBoundingClientRect()
            : { bottom: 70, right: window.innerWidth - 20 };
          const width = Math.min(
            ui.pop === "notif" ? 380 : 300,
            window.innerWidth - 24,

          const style = `top:${r.bottom + 8}px;left:${Math.max(12, Math.min(r.right - width, window.innerWidth - width - 12))}px`;
          if (ui.pop === "account") {

          const items = myNotices();

        function syncScrollTop() {

        const gs = { results: [], cursor: 0 };

        function searchResults(keyword) {

        function paintSearch() {
          const input = document.getElementById("globalSearch");
          const panel = document.getElementById("gsPanel");
          if (!input || !panel) return;
          const keyword = input.value.trim().toLowerCase();
          const expanded =
            document.activeElement === input && keyword.length > 0;
          input.setAttribute("aria-expanded", String(expanded));
          if (!expanded) {
            panel.className = "";
            panel.innerHTML = "";
            gs.results = [];
            return;
          }
          gs.results = searchResults(keyword);
          gs.cursor = Math.min(gs.cursor, Math.max(gs.results.length - 1, 0));
          const item = (result) => {
            const index = gs.results.indexOf(result);
            const head = `<li class="gs-item" role="option" aria-selected="${index === gs.cursor}" data-gs="${index}">`;
            if (result.kind === "application") {
              const a = result.app;
              const meta =
                a.status === "active"
                  ? [
                      a.usesSso ? "SSO" : "Tanpa SSO",
                      a.category || a.description,
                    ]
                      .filter(Boolean)
                      .join(" · ")
                  : "Sedang maintenance";
              return `${head}<span class="gs-logo ${a.color}">${icon(a.icon, 16)}</span><span class="gs-text"><b>${esc(a.name)}</b><small>${esc(meta)}</small></span></li>`;
            }
            return `${head}<span class="gs-menuIcon">${icon(result.menu.icon, 16)}</span><span class="gs-text"><b>${esc(result.menu.label)}</b><small>Menu</small></span></li>`;
          };
          const apps = gs.results.filter((r) => r.kind === "application");
          const menus = gs.results.filter((r) => r.kind === "menu");
          panel.className = "gs-panel";
          panel.setAttribute("role", "listbox");

            ? `${apps.length ? `<ul class="gs-group" role="group" aria-label="Aplikasi"><li class="gs-groupLabel" role="presentation">Aplikasi</li>${apps.map(item).join("")}</ul>` : ""}${menus.length ? `<ul class="gs-group" role="group" aria-label="Menu"><li class="gs-groupLabel" role="presentation">Menu</li>${menus.map(item).join("")}</ul>` : ""}`
            : `<div class="gs-empty">Tidak ada aplikasi atau menu yang cocok.</div>`;
        }

        function chooseSearch(result) {
          if (!result) return;

        function ask({
          title,
          message = "",
          confirmLabel = "Ya, Lanjutkan",
          icon: ic = "circleCheck",
          tone = "primary",
          danger = false,
          withReason = false,
          reasonLabel = "Alasan",
          reasonPlaceholder = "Masukkan alasan",
        }) {
          return new Promise((resolve) => {
            const host = document.createElement("div");
            const reasonField = withReason
              ? `<label class="cp-reason"><span>${esc(reasonLabel)}</span><textarea maxlength="500" placeholder="${esc(reasonPlaceholder)}" data-ask-reason></textarea><em>Wajib diisi. Alasan tersimpan di riwayat aktivitas.</em></label>`
              : "";
            host.innerHTML = `<div class="modal ask show" role="alertdialog" aria-modal="true" aria-labelledby="askTitle" aria-describedby="askMsg"><div class="modal-card ask-card${danger ? " is-danger" : ""} tone-${tone}"><button class="icon-btn ask-close" type="button" aria-label="Tutup" data-ask="0">${icon("x", 18)}</button><div class="ask-ic">${icon(ic, 24)}</div><h3 id="askTitle">${esc(title)}</h3><p id="askMsg">${esc(message)}</p>${reasonField}<div class="ask-btns"><button class="btn btn-ghost" type="button" data-ask="0">Batal${icon("circleX", 18)}</button><button class="btn ask-ok tone-${tone}" type="button" data-ask="1" ${withReason ? "disabled" : ""}>${esc(confirmLabel)}${icon(ic, 18)}</button></div></div></div>`;
            const modal = host.firstElementChild;
            const reasonInput = modal.querySelector("[data-ask-reason]");
            const okButton = modal.querySelector('[data-ask="1"]');
            document.body.appendChild(modal);
            document.body.classList.add("has-ask");
            const finish = (approved) => {
              document.removeEventListener("keydown", onKey, true);
              document.body.classList.remove("has-ask");
              modal.remove();
              resolve(
                withReason
                  ? approved
                    ? reasonInput.value.trim()
                    : null
                  : approved,
              );
            };
            const onKey = (event) => {
              if (event.key === "Escape") {
                event.preventDefault();
                event.stopPropagation();
                finish(false);
              }
            };
            document.addEventListener("keydown", onKey, true);
            reasonInput?.addEventListener("input", (event) => {
              event.stopPropagation();
              okButton.disabled = reasonInput.value.trim() === "";
            });
            modal.addEventListener("mousedown", (event) => {
              if (event.target === modal) finish(false);
            });
            modal.addEventListener("click", (event) => {
              const b = event.target.closest("[data-ask]");
              if (b && !b.disabled) {
                event.stopPropagation();
                finish(b.dataset.ask === "1");
              }
            });
            (reasonInput || okButton).focus();
          });
        }

        const LAUNCH_STAGES = {

        function launch(app) {
          if (app.status !== "active")
            return toast(`${app.name} sedang maintenance.`, "warning");

          closePop();
          closeFloating();
          recordActivity(app);
          audit(
            "launch",
            "application",
            app.name,
            `Dibuka lewat portal ke ${app.host}${app.usesSso ? "" : " tanpa SSO"}`,
          );
          overlay(
            (app.usesSso ? LAUNCH_STAGES.sso : LAUNCH_STAGES.direct)(app.name),
            () => {
              launching = false;
              location.hash = `#/app/${app.slug}`;
            },

        function overlay(stages, done) {
          const paint = (step) => {

          };
          paint(0);
          setTimeout(() => paint(1), 830);
          setTimeout(() => paint(2), 1660);
          setTimeout(() => {
            layer.innerHTML = "";
            done();
          }, 2500);
        }

        function route() {

          const user = db.users.find((u) => u.email === email);
          if (!email || !password) {
            ui.loginError = "Isi email dan password.";
            return render();
          }
          if (!user || password !== PASSWORD) {
            audit(
              "login_failed",
              "session",
              email,
              `Login gagal: ${user ? "Password salah" : "Email tidak terdaftar"}`,
              "failed",
              user || null,
            );
            ui.loginError = "Email atau password salah.";
            return render();
          }
          if (!user.active) {
            audit(
              "login_failed",
              "session",
              email,
              "Login gagal: Akun nonaktif",
              "failed",
              user,
            );
            ui.loginError = "Akun dinonaktifkan. Hubungi Administrator Sistem.";
            return render();
          }
          me = user;
          ui.loginError = "";
          sessionStorage.setItem(SESSION, String(user.id));
          Object.assign(ui, freshPageState());
          audit("login", "session", user.email, "Berhasil masuk ke portal");
          if (location.hash === "#/overview") render(true);
          else location.hash = "#/overview";
        });

        document.addEventListener("click", (e) => {
          const option = e.target.closest("[data-ts-option]");
          if (option && floating?.kind === "select")
            return chooseSelect(Number(option.dataset.tsOption));
          const rowItem = e.target.closest("[data-rowitem]");
          if (rowItem && floating?.kind === "menu") {
            const item = ROW_MENUS.current[Number(rowItem.dataset.rowitem)];
            closeFloating();
            return item && item.run();
          }
          if (
            floating &&
            !e.target.closest(".ts-dropdown, .floating-menu") &&
            e.target.closest("[data-ts], [data-rowmenu]") !== floating.anchor
          ) {
            floating.anchor.classList.remove("open");
            closeFloating();
          }
          const el = e.target.closest("button, a, [data-act]");
          if (!el) {
            if (ui.pop && !e.target.closest(".menu-pop")) closePop();
            return;
          }
          const d = el.dataset;
          if (d.ts) {
            e.preventDefault();
            return openSelect(el);
          }
          if (d.rowmenu) {
            e.preventDefault();
            return openRowMenu(el);
          }
          if (d.act === "toast-close") {
            el.closest(".toast")?.classList.remove("show", "to-interactive");
            return;
          }
          if (d.toast) {
            e.preventDefault();
            ui.pop = null;
            layer.innerHTML = "";
            return toast(d.toast);
          }
          if (d.act === "theme") {
            const dark = document.documentElement.dataset.theme !== "dark";
            if (dark) document.documentElement.dataset.theme = "dark";
            else delete document.documentElement.dataset.theme;
            try {
              localStorage.setItem("sso-demo-theme", dark ? "dark" : "light");
            } catch {}
            ui.pop = null;
            layer.innerHTML = "";
            return;
          }
          if (d.act === "reset") {
            db = seed();
            save();
            me = null;
            sessionStorage.removeItem(SESSION);
            ui.pop = null;
            location.hash = "#/overview";
            render();
            return toast("Data demo dikembalikan seperti semula.");
          }
          if (d.fill) {
            document.getElementById("email").value = d.fill;
            document.getElementById("password").value = PASSWORD;
            document.getElementById("password").focus();
            return;
          }
          if (d.act === "eye") {
            const p = document.getElementById("password");
            p.type = p.type === "password" ? "text" : "password";
            return;
          }
          if (!me) return;
          if (d.pop) {
            e.preventDefault();
            return openPop(d.pop);
          }
          if (d.noticeRemove) {
            db.notifications = db.notifications.filter(
              (n) => n.id !== Number(d.noticeRemove),
            );
            save();
            layer.innerHTML = popover();
            return;
          }
          if (d.act === "notice-clear") {
            return void ask({
              title: "Hapus semua notifikasi?",
              message:
                "Seluruh notifikasi Anda akan dihapus dan tidak bisa dibuka lagi.",
              confirmLabel: "Ya, Hapus",
              danger: true,
              icon: "trash",
              tone: "danger",
            }).then((ok) => {
              if (!ok) return;
              closePop();
              db.notifications = db.notifications.filter(
                (n) => n.userId !== me.id,
              );
              save();
              toast("Semua notifikasi dihapus");
            });
          }
          if (ui.pop && !el.closest(".menu-pop")) closePop();
          if (d.act === "logout") {
            closePop();
            return void ask({
              title: "Keluar dari portal?",
              message:
                "Sesi Anda akan diakhiri. Aplikasi yang sudah dibuka lewat portal tetap memakai sesinya masing-masing.",
              confirmLabel: "Ya, Keluar",
              danger: true,
              icon: "logOut",
              tone: "danger",
            }).then((ok) => {
              if (!ok) return;
              audit("logout", "session", me.email, "Keluar dari portal");
              me = null;
              ui.sheet = false;
              sessionStorage.removeItem(SESSION);
              location.hash = "#/overview";
              render();
            });
          }
          if (d.act === "collapse") {
            ui.collapsed = !ui.collapsed;
            document
              .getElementById("shell")
              ?.classList.toggle("is-collapsed", isCollapsed());
            document
              .querySelectorAll(".sb-section-title")
              .forEach((t) =>
                t.setAttribute("aria-hidden", String(isCollapsed())),
              );
            return showTip(null);
          }
          if (d.act === "sheet") return setSheet(!ui.sheet);
          if (d.act === "sheet-close") {
            if (ui.sheet) setSheet(false);
            return;
          }
          if (d.act === "scroll-top")
            return window.scrollTo({ top: 0, behavior: "smooth" });
          if (d.act === "app-logout") {
            const app = db.apps.find((x) => x.slug === route().arg);
            if (app)
              audit(
                "logout",
                "application",
                app.name,
                "Keluar dari aplikasi, sesi SSO Launcher tetap aktif",
              );
            return overlay(LAUNCH_STAGES.back(), () => {
              location.hash = "#/overview";
            });
          }
          if (d.open) {
            const app = myApps().find((a) => a.id === Number(d.open));
            return app && launch(app);
          }
          if (d.fav) {
            e.preventDefault();
            return void toggleFavorite(Number(d.fav));
          }
          if (d.view) {
            const [path, value] = d.view.split(":");
            const [key, field] = path.split(".");
            ui[key][field] = value;
            if (key === "ov")
              ui.ov[field === "favView" ? "favPage" : "appPage"] = 0;
            if (key === "ma") ui.ma.page = 1;
            return render();
          }
          if (d.tpage) {
            const [key, delta] = d.tpage.split(":");
            const field = key === "fav" ? "favPage" : "appPage";
            ui.ov[field] += Number(delta);
            return render();
          }
          if (d.page) {
            const [key, n] = d.page.split(":");
            if (ui[key]) setPage(key, { page: Number(n) });
            return;
          }
          if (d.reset) {
            const fresh = freshPageState()[d.reset];
            if (d.reset === "ov")
              Object.assign(ui.ov, { q: "", cat: "", appPage: 0 });
            else
              Object.assign(ui[d.reset], {
                ...fresh,
                view: ui[d.reset].view ?? fresh.view,
                size: ui[d.reset].size,
              });
            render();
            return toast("Filter diatur ulang");
          }
          if (d.seg) {
            Object.assign(ui.ma, { seg: d.seg, page: 1 });
            return render();
          }
          if (d.msort) {
            const [scope, key] = d.msort.split(":");
            toggleSort(ui[scope], key);
            return render();
          }
          if (d.bulk) {
            const [scope, action] = d.bulk.split(":");
            return void runBulk(scope, action);
          }
          if (d.sort) {
            const current = ui.rc.sort;
            ui.rc.sort =
              !current || current.key !== d.sort
                ? { key: d.sort, direction: "asc" }
                : current.direction === "asc"
                  ? { key: d.sort, direction: "desc" }
                  : null;
            ui.rc.page = 1;
            return render();
          }
          if (d.act === "fav-modal") {
            ui.fv.modal = true;
            return render();
          }
          if (d.act === "fav-modal-close") {
            ui.fv.modal = false;
            return render();
          }
          if (d.act === "rc-clear") return void clearActivities();
          if (d.act === "rc-remove-many")
            return void removeActivities([...ui.rc.sel]);
          if (d.ustatus !== undefined) {
            ui.userStatus = d.ustatus;
            return render();
          }
        });

        document.addEventListener("input", (e) => {
          const k = e.target.dataset?.input;
          if (
            e.target.matches("[data-ts-search]") &&
            floating?.kind === "select"
          ) {
            floating.query = e.target.value;
            floating.cursor = 0;
            return paintSelect();
          }
          if (!k || k === "global") return;
          if (k.includes(".")) {
            const [key, field] = k.split(".");
            ui[key][field] = e.target.value;
            if (key === "ov") ui.ov.appPage = 0;
            else ui[key].page = 1;
          } else ui[k] = e.target.value;
          rerenderFocus(`[data-input="${k}"]`);
        });
        document.addEventListener("change", (e) => {
          if (e.target.matches("[data-pick]")) {
            const [scope, raw] = e.target.dataset.pick.split(":");
            const id = Number(raw);
            ui[scope].sel = e.target.checked
              ? [...ui[scope].sel, id]
              : ui[scope].sel.filter((x) => x !== id);
            return render();
          }
          if (e.target.matches("[data-pickall]")) {
            const scope = e.target.dataset.pickall;
            const ids = pageSlice(
              scope === "us" ? userList() : groupList(),
              ui[scope],
            ).map((x) => x.id);
            ui[scope].sel = e.target.checked
              ? [...new Set([...ui[scope].sel, ...ids])]
              : ui[scope].sel.filter((x) => !ids.includes(x));
            return render();
          }
          if (e.target.matches("[data-rc-pick]")) {
            const id = Number(e.target.dataset.rcPick);
            ui.rc.sel = e.target.checked
              ? [...ui.rc.sel, id]
              : ui.rc.sel.filter((x) => x !== id);
            return render();
          }
          if (e.target.matches("[data-rc-all]")) {
            const ids = pageSlice(recentList().list, ui.rc).map((x) => x.id);
            ui.rc.sel = e.target.checked
              ? [...new Set([...ui.rc.sel, ...ids])]
              : ui.rc.sel.filter((x) => !ids.includes(x));
            return render();
          }
        });
        document.addEventListener("keydown", (e) => {
          if (floating?.kind === "select") {
            const options = selectOptions();
            if (e.key === "Escape") {
              e.preventDefault();
              const anchor = floating.anchor;
              anchor.classList.remove("open");
              closeFloating();
              return anchor.focus();
            }
            if (e.key === "ArrowDown") {
              e.preventDefault();
              floating.cursor = Math.min(
                floating.cursor + 1,
                Math.max(options.length - 1, 0),
              );
              return paintSelect();
            }
            if (e.key === "ArrowUp") {
              e.preventDefault();
              floating.cursor = Math.max(floating.cursor - 1, 0);
              return paintSelect();
            }
            if (e.key === "Enter") {
              e.preventDefault();
              return chooseSelect(floating.cursor);
            }
          }
          if (floating?.kind === "menu" && e.key === "Escape")
            return closeFloating();
          if (e.key === "Escape" && ui.fv.modal) {
            ui.fv.modal = false;
            return render();
          }
          if (e.key === "Escape" && ui.pop) closePop();
          if (e.key === "Escape" && ui.sheet) setSheet(false);
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
            const input = document.getElementById("globalSearch");
            if (input) {
              e.preventDefault();
              input.focus();
              input.select();
            }
          }
          if (e.target.id === "globalSearch") {
            if (e.key === "ArrowDown") {
              e.preventDefault();
              gs.cursor = Math.min(gs.cursor + 1, gs.results.length - 1);
              paintSearch();
            }
            if (e.key === "ArrowUp") {
              e.preventDefault();
              gs.cursor = Math.max(gs.cursor - 1, 0);
              paintSearch();
            }
            if (e.key === "Enter") {
              e.preventDefault();
              chooseSearch(gs.results[gs.cursor]);
            }
            if (e.key === "Escape") {
              e.target.value = "";
              gs.cursor = 0;
              e.target.blur();
              paintSearch();
            }
          }
        });
        document.addEventListener("input", (e) => {
          if (e.target.id === "globalSearch") {
            gs.cursor = 0;
            paintSearch();
          }
        });
        document.addEventListener("focusin", (e) => {
          if (e.target.id === "globalSearch") paintSearch();
        });
        document.addEventListener("focusout", (e) => {
          if (e.target.id === "globalSearch") setTimeout(paintSearch, 0);
        });
        document.addEventListener("mousedown", (e) => {
          const option = e.target.closest("[data-gs]");
          if (option) {
            e.preventDefault();
            chooseSearch(gs.results[Number(option.dataset.gs)]);
          }
        });
        document.addEventListener("mousedown", (e) => {
          if (e.target.matches("[data-modal]")) {
            ui.fv.modal = false;
            render();
          }
        });
        document.addEventListener("mouseover", (e) => {
          const tipTargetEl = e.target.closest("[data-mtip]");
          if (tipTargetEl) showMaintenanceTip(tipTargetEl);
          else if (tipTarget) hideMaintenanceTip();
          const tsOption = e.target.closest("[data-ts-option]");
          if (
            tsOption &&
            floating?.kind === "select" &&
            Number(tsOption.dataset.tsOption) !== floating.cursor
          ) {
            floating.cursor = Number(tsOption.dataset.tsOption);
            paintSelect();
          }
          const option = e.target.closest("[data-gs]");
          if (option && Number(option.dataset.gs) !== gs.cursor) {
            gs.cursor = Number(option.dataset.gs);
            paintSearch();
          }
          const nav = e.target.closest(".sb .nav");
          if (nav) showTip(nav);
          else if (!e.target.closest(".sb")) showTip(null);
        });
        window.addEventListener("hashchange", () => {
          closePop();
          closeFloating();
          hideMaintenanceTip();
          ui.sheet = false;
          Object.assign(ui, freshPageState());
          render(true);
          window.scrollTo({ top: 0 });
        });
        window.addEventListener(
          "scroll",
          () => {
            if (floating) {
              floating.anchor.classList.remove("open");
              closeFloating();
            }
            if (tipTarget) hideMaintenanceTip();
          },
          { passive: true, capture: true },
        );
        window.addEventListener("scroll", syncScrollTop, { passive: true });
        forcedCollapse.addEventListener("change", () => {
          if (me && document.getElementById("shell")) syncShell(currentPage);
        });
        let resizeTimer;
        window.addEventListener("resize", () => {
          if (ui.pop) closePop();
          if (floating) closeFloating();
          syncScrollTop();
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            if (
              me &&
              document.getElementById("shell") &&
              currentPage === "overview"
            )
              render();
          }, 150);
        });

        me =
          db.users.find(
            (u) => u.id === Number(sessionStorage.getItem(SESSION)),
          ) || null;
        render(true);
      })();
    </script>
  </body>
</html>
