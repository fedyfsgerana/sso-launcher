:root {
  --g900: #173f2d;
  --g800: #1f5a3f;
  --g700: #2a6a4a;
  --g600: #3f7d5c;
  --g500: #5f9277;
  --g300: #a9c3b1;
  --g200: #cfdfd2;
  --g100: #e4ede5;
  --g50: #f1f6f1;
  --ink: #14231c;
  --body: #4d5b53;
  --muted: #7a867f;
  --line: #e5ebe5;
  --font-sans: var(--font-geist-sans), "Helvetica Neue", Arial, sans-serif;
  --font-mono: var(--font-geist-mono), ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ink-2: #26352c;
  --ink-3: #3a4a41;
  --faint: #9aa79f;
  --line-strong: #cfd6d1;
  --line-hover: #bfc8c2;
  --surface-sunken: #fafcf9;
  --surface-stripe: #f8faf8;
  --surface-hover: #f3f5f4;
  --surface-muted: #eef1ef;
  --surface-panel: var(--card);
  --shadow-ink: #142d1e;
  --bg: #f6f8f5;
  --card: #fff;
  --danger: var(--pal-red);
  --sw: 248px;
  --sw-c: 76px;
  --shadow: 0 1px 2px color-mix(in srgb, var(--shadow-ink) 4%, transparent), 0 4px 14px -6px color-mix(in srgb, var(--shadow-ink) 8%, transparent);
}

* {
  box-sizing: border-box
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased
}

button,
input {
  font: inherit;
  color: inherit
}

button {
  cursor: pointer
}

.hidden {
  display: none !important
}

svg.i {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
  display: block
}

.shell {
  display: grid;
  min-height: 100dvh
}

.sb {
  position: sticky;
  top: 0;
  height: 100dvh;
  background: var(--card);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  z-index: 30
}

.sb-resize {
  position: absolute;
  top: 0;
  right: -4px;
  bottom: 0;
  z-index: 5;
  width: 8px;
  cursor: col-resize;
  touch-action: none
}

.sb-resize::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 3px;
  width: 2px;
  background: transparent;
  transition: background .15s
}

.sb-resize:hover::after,
.sb.is-resizing .sb-resize::after {
  background: var(--g600)
}

.sb.is-resizing,
.sb.is-resizing * {
  transition: none !important;
  user-select: none;
  cursor: col-resize
}

.sb-brand {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 16px;
  flex: none
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  min-width: 0
}

.brand-link {
  border-radius: var(--r-ctl);
  color: inherit;
  text-decoration: none;
  transition: opacity var(--dur-fast, .16s) ease
}

.brand-link:hover {
  opacity: .78
}

.brand-link:focus-visible {
  outline: 2px solid var(--g600);
  outline-offset: 4px
}

.brand>b {
  animation: mark-word .45s ease-out .55s backwards
}

.brand>b>span {
  display: inline-block;
  animation: mark-word .45s ease-out .8s backwards
}

@keyframes mark-word {
  from {
    opacity: 0;
    transform: translateX(-8px)
  }
}

@media (prefers-reduced-motion: reduce) {

  .brand-logo,
  .brand>b,
  .brand>b>span,
  .brand-text b,
  .brand-text b>span,
  .brand-text small {
    animation: none
  }
}

.brand b {
  color: var(--g900, var(--g900));
  font-size: 15px;
  font-weight: 800;
  letter-spacing: .06em;
  line-height: 1;
  white-space: nowrap
}

.brand b span {
  margin-left: .27em;
  color: var(--g600);
  font-weight: 400
}

.sb-nav {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent
}

.sb-tip {
  position: fixed;
  z-index: 80;
  background: var(--g900);
  color: #fff;
  font-size: 12.5px;
  font-weight: 500;
  padding: 7px 12px;
  border-radius: var(--r-sm);
  pointer-events: none;
  opacity: 0;
  transform: translate(-4px, -50%);
  transition: opacity .12s, transform .12s;
  white-space: nowrap;
  box-shadow: var(--shadow)
}

.sb-tip.show {
  opacity: 1;
  transform: translate(0, -50%)
}

.sb-tip::before {
  content: "";
  position: absolute;
  left: -4px;
  top: 50%;
  width: 8px;
  height: 8px;

.hover-tip {
  position: fixed;
  z-index: 80;
  display: grid;
  gap: 2px;
  max-width: 240px;
  padding: 6px 10px;
  border-radius: var(--r-sm);
  background: var(--g900);
  color: #fff;
  font-size: 11.5px;
  line-height: 1.35;
  pointer-events: none;
  box-shadow: var(--shadow);
  animation: hover-tip-in .18s cubic-bezier(.2, .7, .3, 1) both
}

.hover-tip.below {
  --tip-shift: 4px;
  transform: translate(-50%, 0)
}

.hover-tip.above {
  --tip-shift: -4px;
  transform: translate(-50%, -100%)
}

.hover-tip.is-leaving {
  animation: hover-tip-out .14s ease-in both
}

.hover-tip::before {
  content: "";
  position: absolute;
  left: 50%;
  width: 6px;
  height: 6px;
  background: inherit;
  transform: translateX(-50%) rotate(45deg)
}

.hover-tip.below::before {
  top: -3px
}

.hover-tip.above::before {
  bottom: -3px
}

.hover-tip b {
  font-size: 12px;
  font-weight: 600
}

.hover-tip-row {
  display: flex;
  align-items: flex-start;
  gap: 5px;
  color: rgba(255, 255, 255, .82)
}

.hover-tip-row svg.i {
  width: 11px;
  height: 11px;
  margin-top: 2px;
  stroke-width: 2
}

.hover-tip-row.warn {
  color: var(--pal-amber)
}

html[data-theme="dark"] .hover-tip {
  background: var(--g100);
  color: var(--ink)
}

html[data-theme="dark"] .hover-tip-row {
  color: var(--muted)
}

@keyframes hover-tip-in {
  from {
    opacity: 0;
    translate: 0 var(--tip-shift)
  }

  to {
    opacity: 1;
    translate: 0 0
  }
}

@keyframes hover-tip-out {
  from {
    opacity: 1;
    translate: 0 0
  }

  to {
    opacity: 0;
    translate: 0 var(--tip-shift)
  }
}

@media (prefers-reduced-motion: reduce) {

.lp-check input {

  width: 0;
  height: 0

.lp-box {

  display: grid;
  place-items: center;

  height: 18px;

  min-height: 0;

.lp-check input:checked+.lp-box svg {

.lp-check input:focus-visible+.lp-box {

.lp-forgot {

.lp-forgot:hover {

.lp-submit {

  font-weight: 600;

  align-items: center;
  justify-content: center;

.la {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--pal-canvas)
}

.la::before,
.la::after,
.la-glow {
  content: "";
  position: absolute;
  border-radius: 50%;
  pointer-events: none
}

.la::before {
  top: -18%;
  right: -12%;
  width: 58%;
  aspect-ratio: 1;
  background: radial-gradient(circle at 35% 35%, color-mix(in srgb, var(--pal-sage) 50%, transparent), transparent 68%);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pal-brand) 7%, transparent);
  animation: la-drift 18s ease-in-out infinite alternate
}

.la::after {
  bottom: -22%;
  left: 34%;
  width: 40%;
  aspect-ratio: 1;
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--pal-brand) 12%, transparent), transparent 66%);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pal-brand) 6%, transparent);
  animation: la-drift 22s ease-in-out infinite alternate-reverse
}

.la-glow {
  top: 24%;
  left: -8%;
  width: 34%;
  aspect-ratio: 1;
  background: radial-gradient(circle, rgba(255, 255, 255, .6), rgba(255, 255, 255, 0) 70%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .5);
  animation: la-drift 20s ease-in-out infinite alternate
}

.la-rings {
  position: absolute;
  left: -14%;
  bottom: -34%;
  width: 62%;
  height: auto;
  color: var(--g700);
  pointer-events: none
}

.la-stage {
  --la-band: 404px;
  position: absolute;
  z-index: 2;
  top: 50%;
  right: 5%;
  left: 6%;
  display: flex;
  height: var(--la-band);
  gap: 4%;
  transform: translateY(-50%)
}

.la-copy {
  flex: 0 1 44%;
  min-width: 0;
  display: flex;
  flex-direction: column
}

.lb-art {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  justify-content: center
}

.lb-art svg {
  display: block;
  width: auto;
  max-width: 100%;
  height: 100%;
  overflow: visible
}

.lb-link {
  fill: none;
  stroke: var(--pal-brand);
  stroke-width: 2.5;
  stroke-dasharray: 3 9;
  opacity: .4;
  animation: la-flow 1.6s linear infinite
}

.lb-pulse {
  fill: var(--pal-brand)
}

.lb-app {
  animation: la-float 4.2s ease-in-out infinite
}

.lb-type {
  transform-box: fill-box;
  transform-origin: left center;
  animation: lb-type 3.2s ease-in-out infinite
}

.lb-type2 {
  animation-delay: .35s
}

.lb-check {
  transform-box: fill-box;
  transform-origin: center;
  animation: lb-check 3.2s ease-in-out infinite
}

.lb-leafA,
.lb-leafB {
  transform-box: fill-box;
  animation: la-sway 4s ease-in-out infinite
}

.lb-leafA {
  transform-origin: 0% 100%
}

.lb-leafB {
  transform-origin: 100% 0%;
  animation-delay: -2s
}

.lb-key {
  transform-box: fill-box;
  transform-origin: center;
  animation: la-float 5s ease-in-out infinite;
  animation-delay: -1.5s
}

.la-copy h2 {
  margin: 0;
  font-size: clamp(22px, 2vw, 34px);
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -.01em;
  text-wrap: balance;
  color: var(--ink)
}

.la-copy p {
  margin: 14px 0 0;
  max-width: 430px;
  color: var(--pal-brand);
  font-size: clamp(13px, 1vw, 16px);
  line-height: 1.55
}

.la-points {
  display: grid;
  gap: 12px;
  margin: auto 0 0;
  padding: 0;
  list-style: none
}

.la-points li {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--ink-3);
  font-size: clamp(13px, .95vw, 15px);
  font-weight: 500
}

.la-points span {
  display: grid;
  place-items: center;
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: rgba(255, 255, 255, .7);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--pal-brand) 12%, transparent);
  color: var(--pal-brand)
}

.la-points svg.i {
  width: 17px;
  height: 17px
}

.la-brand {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 14px
}

.la-brand .la-logo {
  display: block;
  flex: none;
  width: 44px;
  height: auto
}

.la-divider {
  flex: none;
  width: 2px;
  height: 38px;
  border-radius: 2px;
  background: var(--pal-brand);
  opacity: .35
}

.la-brand b {
  display: block;
  color: var(--pal-brand);
  font-size: 18px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: .02em
}

.la-brand b span {
  font-weight: 400;
  color: var(--pal-leaf)
}

.la-brand small {
  display: block;
  color: var(--body);
  font-size: 11px;
  line-height: 1;
  letter-spacing: .08em;
  margin-top: 6px
}

html[data-theme="dark"] .lb-art {
  filter: brightness(.72) saturate(.9)
}

html[data-theme="dark"] .la-copy p {
  color: var(--pal-sage)
}

html[data-theme="dark"] .la-brand small {
  color: var(--muted)
}

html[data-theme="dark"] .la::before {
  background: radial-gradient(circle at 35% 35%, color-mix(in srgb, var(--pal-sage) 12%, transparent), transparent 68%);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pal-sage) 8%, transparent)
}

html[data-theme="dark"] .la::after {
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--pal-sage) 10%, transparent), transparent 66%);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pal-sage) 6%, transparent)
}

html[data-theme="dark"] .la-glow {
  background: radial-gradient(circle, rgba(255, 255, 255, .05), rgba(255, 255, 255, 0) 70%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .05)
}

html[data-theme="dark"] .la-points li {
  color: var(--body)
}

html[data-theme="dark"] .la-points span {
  background: rgba(255, 255, 255, .06);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--pal-sage) 25%, transparent);
  color: var(--pal-sage)
}

html[data-theme="dark"] .la-brand b {
  color: var(--pal-sage)
}

@keyframes la-flow {
  to {
    stroke-dashoffset: -36
  }
}

@keyframes la-float {

  0%,
  100% {
    transform: translateY(0)
  }

  50% {
    transform: translateY(-12px)
  }
}

@keyframes lb-type {
  0% {
    transform: scaleX(0)
  }

  35%,
  80% {
    transform: scaleX(1)
  }

  100% {
    transform: scaleX(1);
    opacity: 0
  }
}

@keyframes lb-check {

  0%,
  40% {
    transform: scale(0);
    opacity: 0
  }

  52% {
    transform: scale(1.15);
    opacity: 1
  }

  60%,
  88% {
    transform: scale(1);
    opacity: 1
  }

  100% {
    transform: scale(1);
    opacity: 0
  }
}

@keyframes la-drift {
  from {
    transform: translate(0, 0)
  }

  to {
    transform: translate(-3%, 4%)
  }
}

@keyframes la-sway {

  0%,
  100% {
    transform: rotate(0)
  }

  50% {
    transform: rotate(3deg)
  }
}

@media (prefers-reduced-motion:reduce) {

  .la *,
  .la::before,
  .la::after {
    animation: none !important
  }

  .lb-pulse {
    display: none
  }
}

@media not all and (min-aspect-ratio:13/10) and (min-width:900px) {
  .la-stage {
    height: auto;
    align-items: center
  }

  .la-copy {
    display: block
  }

  .la-points {
    margin-top: 22px
  }

  .la-brand {
    margin-top: 24px
  }

  .lb-art svg {
    width: min(100%, 46dvh);
    height: auto
  }
}

@media (prefers-reduced-motion: reduce) {

  .lp-logo .lp-logo-img,
  .lp-brand-text b,
  .lp-brand-text b>span,
  .lp-brand-text small {
    animation: none
  }
}

.demo-account:hover { border-color: var(--g600); }
.demo-account b { display: block; font-weight: 600; color: var(--ink); font-size: 13px; }
.demo-account small { color: var(--muted); font-size: 12px; }
.demo-app {
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
}
.demo-app-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 24px;
  color: #fff;
}
.demo-app-bar b { font-size: 16px; }
.demo-app-bar small { opacity: .8; }
.demo-app-bar .demo-app-brand { display: flex; align-items: center; gap: 12px; }
.demo-app-bar .demo-app-brand > span { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,.18); }
.demo-app-bar button { border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.12); color: #fff; border-radius: 10px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.demo-app-body { max-width: 920px; margin: 0 auto; padding: 28px 20px 60px; display: grid; gap: 16px; }
.demo-app-body .card { padding: 22px; }
.demo-app-body h1 { margin: 0 0 6px; font-size: 22px; }
.demo-app-body p { margin: 0; color: var(--body); }
.demo-app-body pre { margin: 12px 0 0; padding: 14px; border-radius: 10px; background: var(--surface-sunken); border: 1px solid var(--line); overflow: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; color: var(--ink-2); }
.demo-steps { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 6px; color: var(--body); }
.demo-table td, .demo-table th { white-space: nowrap; }
.lp { top: var(--demo-bar-h, 0px); }
.demo-still .shell *, .demo-still .shell *::before, .demo-still .shell *::after { animation: none !important; transition: none !important; }
</style>

    return `<section class="hero hero-page"><div class="hero-copy"><div class="eyebrow"><i class="rule"></i>SSO LAUNCHER</div><h1>${esc(title)}</h1>${description ? `<p>${esc(description)}</p>` : ""}</div>${actions ? `<div class="hero-actions">${actions}</div>` : ""}${rings("hero-rings")}</section>`;
  }
  const dot = (a) => { const s = a.status === "maintenance" ? "maintenance" : a.usesSso ? "sso" : "link"; return `<span class="app-dot ${s}" aria-hidden="true">${icon({ sso: "shieldCheck", link: "external", maintenance: "wrench" }[s], 10)}</span>`; };
  const empty = (title, description, inPanel = true) => `<div class="${inPanel ? "empty" : "card empty"}" style="${inPanel ? "grid-column:1 / -1" : ""}"><b>${esc(title)}</b>${esc(description)}</div>`;
  const stack = (apps, label) => `<span class="as-stack">${apps.length ? `<span class="as-logos" aria-hidden="true">${apps.slice(0, 4).map((a) => `<span class="as-logo ${a.color}">${icon(a.icon, 13)}</span>`).join("")}${apps.length > 4 ? `<span class="as-more">+${apps.length - 4}</span>` : ""}</span>` : ""}<span class="as-count">${esc(label)}</span></span>`;
  const viewToggle = (key, value) => `<div class="view-tg" role="group" aria-label="Tampilan"><button class="${value === "grid" ? "on" : ""}" type="button" aria-label="Tampilan kotak" aria-pressed="${value === "grid"}" data-view="${key}:grid">${icon("grid", 18)}</button><button class="${value === "list" ? "on" : ""}" type="button" aria-label="Tampilan daftar" aria-pressed="${value === "list"}" data-view="${key}:list">${icon("list", 18)}</button></div>`;
  const statusBadge = (tone, ic, text) => `<span class="status ${tone}">${icon(ic, 13)}${esc(text)}</span>`;

  function tilePager(key, apps, view, label) {
    const width = (document.querySelector(".main")?.clientWidth || window.innerWidth) - 120;
    const columns = Math.min(12, Math.max(1, Math.floor((width + 6) / 106)));
    const size = view === "list" ? 6 : columns;
    const pages = Math.max(1, Math.ceil(apps.length / size));
    const current = Math.min(ui.pages[key], pages - 1);
    ui.pages[key] = current;
    const start = current * size;
    const shown = apps.slice(start, start + size);
    const item = (a) => view === "list"
      ? `<button class="ov-listRow${a.status !== "active" ? " ov-disabled ov-maintenance" : ""}" type="button" data-open="${a.id}"><span class="ov-tileIcon"><span class="ov-logo ov-listLogo ${a.color}">${icon(a.icon, 20)}</span>${dot(a)}</span><span class="ov-listText"><b>${esc(a.name)}</b><small>${esc(a.category)}</small></span>${icon("chevronRight", 18)}</button>`
      : `<button class="ov-tile${a.status !== "active" ? " ov-disabled ov-maintenance" : ""}" type="button" data-open="${a.id}" title="${a.status === "maintenance" ? esc(a.maintenanceMessage) : ""}"><span class="ov-tileIcon"><span class="ov-logo ${a.color}">${icon(a.icon, 24)}</span>${dot(a)}</span><b class="ov-tileName">${esc(a.name)}</b><small class="ov-tileMeta">${esc(a.category)}</small></button>`;
    return `<div class="${view === "list" ? "ov-listGrid" : "ov-pagerGrid"}" style="--columns:${columns}">${shown.map(item).join("")}</div>
      <footer class="ov-sectionFoot">${stack(apps, label)}<div class="ov-pagerNav"><span class="ov-pagerInfo">${start + 1}–${start + shown.length} dari ${apps.length}</span>
      <button class="ov-pagerButton ov-pagerPrev" type="button" aria-label="Halaman sebelumnya" ${current === 0 ? "disabled" : ""} data-tpage="${key}:-1">${icon("chevronLeft", 18)}</button>
      <button class="ov-pagerButton ov-pagerNext" type="button" aria-label="Halaman berikutnya" ${current >= pages - 1 ? "disabled" : ""} data-tpage="${key}:1">${icon("chevronRight", 18)}</button></div></footer>`;
  }
  const section = (title, ic, toolbar, body) => `<section class="card ov-section"><header class="ov-sectionHead"><h3><i class="ch-ic">${icon(ic, 18)}</i>${esc(title)}</h3>${toolbar}</header>${body}</section>`;

  function pageOverview() {
    const apps = myApps().sort((l, r) => (Date.parse(r.lastOpenedAt || 0) || 0) - (Date.parse(l.lastOpenedAt || 0) || 0) || l.name.localeCompare(r.name));
    const favs = apps.filter((a) => a.isFavorite);
    const cats = [...new Set(apps.map((a) => a.category))].sort();
    const kw = ui.q.trim().toLowerCase();
    const shown = apps.filter((a) => (!ui.cat || a.category === ui.cat) && (!kw || `${a.name} ${a.category} ${a.description}`.toLowerCase().includes(kw)));
    const recent = db.audit.filter((x) => x.actor === me.name).slice(0, 8);
    const first = me.name.split(" ")[0];
    const stat = (ic, label, value, tone) => `<div class="sc-card sc-${tone}"><span class="sc-icon">${icon(ic, 20)}</span><span class="sc-text"><b>${value}</b><small>${esc(label)}</small></span></div>`;
    const appToolbar = apps.length ? `<div class="ov-toolbar"><label class="search us-search">${icon("search", 18)}<input placeholder="Cari aplikasi" value="${esc(ui.q)}" data-input="q"></label>
      <div class="seg-select"><select aria-label="Semua kategori" data-input="cat"><option value="">Semua kategori</option>${cats.map((c) => `<option ${c === ui.cat ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
      ${viewToggle("apps", ui.views.apps)}<button class="icon-sq" type="button" aria-label="Atur ulang filter" title="Atur ulang filter" data-act="reset-filter">${icon("rotate", 18)}</button></div>` : "";
    const topics = [["lock", "var(--pal-slate)", "Lupa password", "Minta reset ke Administrator", "Hubungi Administrator Sistem untuk mengatur ulang password Anda."], ["grid", "var(--pal-teal)", "Belum punya akses", "Ajukan akses aplikasi", "Minta Administrator Sistem menambahkan Anda ke grup yang punya akses aplikasi tersebut."], ["triangle", "var(--pal-red)", "Aplikasi tidak bisa dibuka", "Laporkan kendala", "Catat nama aplikasi dan pesan yang muncul, lalu laporkan ke Administrator Sistem."], ["shieldAlert", "var(--pal-orange)", "Akun terkunci", "Terlalu banyak percobaan login", "Akun dikunci sementara karena terlalu banyak percobaan login. Tunggu beberapa menit lalu coba lagi."]];
    return `<div class="page" id="overviewPage">${hero(`Beranda — ${greeting()}, ${first}`, fullDate())}
      <div class="ov-stack"><div class="sc-grid">${stat("window", "Aplikasi tersedia", apps.length, "success")}${stat("star", "Favorit", favs.length, "success")}${stat("history", "Dibuka minggu ini", apps.filter((a) => a.lastOpenedAt && Date.now() - Date.parse(a.lastOpenedAt) < 7 * 864e5).length, "info")}${stat("wrench", "Sedang perbaikan", apps.filter((a) => a.status === "maintenance").length, "warn")}</div>
      ${section("Favorit", "star", favs.length ? viewToggle("fav", ui.views.fav) : "", favs.length ? tilePager("fav", favs, ui.views.fav, `${favs.length} favorit`) : empty("Belum ada favorit", "Tandai aplikasi yang sering dipakai dengan ikon bintang di Aplikasi Saya."))}
      ${section("Aplikasi Saya", "grid", appToolbar, !apps.length ? empty("Belum ada aplikasi", "Hubungi Administrator Sistem untuk mendapatkan akses aplikasi.") : shown.length ? tilePager("apps", shown, ui.views.apps, `${shown.length} aplikasi`) : empty("Aplikasi tidak ditemukan", "Coba ubah kata kunci atau kategori."))}
      <div class="ov-row">${section("Aktivitas Terbaru", "history", "", recent.length ? `<ul class="ov-activities">${recent.map((x) => `<li class="ov-activity"><span class="ov-activityIcon ov-soft ${x.tone}">${icon(x.action === "Buka" ? "external" : x.action === "Tambah" ? "plus" : "pencil", 17)}</span><span class="ov-activityText"><b>${esc(x.action)} ${esc(x.target.toLowerCase())}</b><small>${esc(x.name)}</small></span><time class="ov-activityTime">${rel(x.at)}</time></li>`).join("")}</ul>` : empty("Belum ada aktivitas", "Aplikasi yang Anda buka akan tercatat di sini."))}
      <section class="card help"><div class="eyebrow"><i class="rule"></i>BANTUAN</div><h3>Butuh bantuan?</h3><ul class="help-topics">${topics.map((t) => `<li><button type="button" data-toast="${esc(t[4])}"><span class="help-tile" style="background:${t[1]}">${icon(t[0], 16)}</span><span class="help-text"><b>${t[2]}</b><small>${t[3]}</small></span>${icon("chevronRight", 16)}</button></li>`).join("")}</ul><button class="btn" type="button" data-toast="Hubungi Administrator Sistem untuk bantuan akun.">Hubungi Administrator${icon("headset", 18)}</button></section></div></div></div>`;
  }

  function pageMyApps(filter) {
    const apps = myApps();
    const cats = [...new Set(apps.map((a) => a.category))].sort();
    const kw = ui.maQ.trim().toLowerCase();
    let list = apps.filter((a) => (!ui.maCat || a.category === ui.maCat) && (!kw || `${a.name} ${a.category} ${a.description}`.toLowerCase().includes(kw)));
    if (filter === "favorites") list = list.filter((a) => a.isFavorite);
    if (filter === "recent") list = list.filter((a) => a.lastOpenedAt).sort((l, r) => Date.parse(r.lastOpenedAt) - Date.parse(l.lastOpenedAt));
    const pages = Math.max(1, Math.ceil(list.length / ui.maSize));
    ui.maPage = Math.min(ui.maPage, pages);
    const rows = list.slice((ui.maPage - 1) * ui.maSize, ui.maPage * ui.maSize);
    const title = { all: "Aplikasi Saya", favorites: "Favorit", recent: "Terbaru" }[filter];
    const desc = { all: "Akses cepat ke aplikasi yang tersedia untuk Anda.", favorites: "Aplikasi yang Anda tandai sebagai favorit.", recent: "Aplikasi yang terakhir Anda buka." }[filter];
    const segs = [["all", "Semua", "grid", "my-apps"], ["favorites", "Favorit", "star", "favorites"], ["recent", "Terbaru", "history", "recent"]];
    const card = (a) => `<article class="ac${a.status === "maintenance" ? " is-maintenance" : ""}" title="${a.status === "maintenance" ? esc(a.maintenanceMessage) : ""}"><button class="ac-hit" type="button" aria-label="Buka ${esc(a.name)}" data-open="${a.id}"><span class="ac-logo-wrap"><span class="ac-logo ${a.color}">${icon(a.icon, 24)}</span>${dot(a)}</span><span class="ac-txt"><span class="ac-title"><b>${esc(a.name)}</b><span class="ac-cat${a.status === "maintenance" ? " warn" : ""}" title="${esc(a.category)}">${icon("tag", 12)}<span>${esc(a.category)}</span></span></span><small>${esc(a.description)}</small></span></button><button class="${a.isFavorite ? "star on" : "star"}" type="button" aria-pressed="${a.isFavorite}" aria-label="${a.isFavorite ? "Hapus dari" : "Tambah ke"} favorit" data-fav="${a.id}">${icon(a.isFavorite ? "starOff" : "star", 18)}</button></article>`;
    const start = list.length ? (ui.maPage - 1) * ui.maSize + 1 : 0;
    const end = Math.min(list.length, ui.maPage * ui.maSize);
    return `<div class="page">${hero(title, desc)}<div class="card ma-panel"><div class="ma-bar us-bar"><label class="search us-search">${icon("search", 18)}<input placeholder="Cari aplikasi" value="${esc(ui.maQ)}" data-input="maQ"></label>
      <div class="segs" role="group" aria-label="Filter aplikasi">${segs.map((s) => `<a class="${filter === s[0] ? "seg on" : "seg"}" href="#/${s[3]}" aria-pressed="${filter === s[0]}">${icon(s[2], 15)}${s[1]}</a>`).join("")}</div>
      <div class="seg-select"><select aria-label="Semua Kategori" data-input="maCat"><option value="">Semua Kategori</option>${cats.map((c) => `<option ${c === ui.maCat ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
      ${viewToggle("ma", ui.maView)}<button class="icon-sq" type="button" aria-label="Atur ulang filter" title="Atur ulang filter" data-act="reset-ma">${icon("rotate", 18)}</button></div>
      <div class="${ui.maView === "list" ? "ma-grid is-list" : "ma-grid"}">${rows.length ? rows.map(card).join("") : empty(kw || ui.maCat ? "Tidak ada hasil" : filter === "favorites" ? "Belum ada favorit" : "Belum ada aplikasi", kw || ui.maCat ? "Coba ubah kata kunci atau kategori." : filter === "favorites" ? "Klik ikon bintang pada aplikasi untuk menambahkannya ke favorit." : "Aplikasi yang Anda buka akan muncul di sini.")}</div>
      ${pager(list.length, start, end, pages, ui.maPage, "ma", list.length ? stack(list, `${list.length} aplikasi`) : "", [9, 18, 36], ui.maSize, "aplikasi")}</div></div>`;
  }

  function pager(total, start, end, pages, current, key, summary, sizes, size, unit) {
    const nums = Array.from({ length: pages }, (_, i) => i + 1);
    return `<div class="pager">${summary || `<span class="muted">${total ? `Menampilkan ${start}–${end} dari ${total} ${unit}` : "Tidak ada data"}</span>`}<div class="pager-r">${summary && total ? `<span class="muted">${start}–${end} dari ${total}</span>` : ""}
      <div class="seg-select"><select aria-label="Jumlah per halaman" data-size="${key}">${sizes.map((s) => `<option value="${s}" ${s === size ? "selected" : ""}>${s} / halaman</option>`).join("")}</select></div>
      <nav class="pages" aria-label="Halaman"><button type="button" aria-label="Sebelumnya" ${current === 1 ? "disabled" : ""} data-page="${key}:${current - 1}">${icon("chevronLeft", 16)}</button>${nums.map((n) => `<button type="button" class="${n === current ? "on" : ""}" ${n === current ? 'aria-current="page"' : ""} data-page="${key}:${n}">${n}</button>`).join("")}<button type="button" aria-label="Berikutnya" ${current === pages ? "disabled" : ""} data-page="${key}:${current + 1}">${icon("chevronRight", 16)}</button></nav></div></div>`;
  }

  const sortTh = (label, cls = "") => `<th class="${cls}"><button class="sort-th" type="button" title="Urutkan ${esc(label)}">${esc(label)}${icon("chevronsUpDown", 13)}</button></th>`;
  const rowAct = (label) => `<div class="row-acts"><button class="row-act" type="button" aria-label="${esc(label)}" title="Aksi lainnya" data-toast="Di demo ini, aksi ubah dan hapus tidak tersedia. Coba di aplikasi asli.">${icon("ellipsis", 17)}</button></div>`;
  const tablePage = (title, desc, btn, toolbar, head, rows, total, unit) => `<div class="page">${hero(title, desc, btn ? `<button class="btn" type="button" data-toast="Form ${esc(btn.toLowerCase())} tersedia di aplikasi asli.">${esc(btn)}${icon("plus", 18)}</button>` : "")}<div class="card ma-panel">${toolbar}<div class="table-wrap"><table class="dt ut demo-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>${pager(total, total ? 1 : 0, total, 1, 1, "x", "", [10, 25, 50], 10, unit)}</div></div>`;

  function pageUsers() {
    const kw = ui.userQ.trim().toLowerCase();
    const list = db.users.filter((u) => (!ui.userStatus || (ui.userStatus === "active") === u.active) && (!kw || `${u.name} ${u.email} ${u.nik} ${u.department}`.toLowerCase().includes(kw)));
    const counts = { all: db.users.length, active: db.users.filter((u) => u.active).length, inactive: db.users.filter((u) => !u.active).length };
    const toolbar = `<div class="ma-bar us-bar"><label class="search us-search">${icon("search", 18)}<input placeholder="Cari nama, NIK, email, atau departemen" value="${esc(ui.userQ)}" data-input="userQ"></label><div class="segs" role="group" aria-label="Status">${[["", "Semua", counts.all], ["active", "Aktif", counts.active], ["inactive", "Nonaktif", counts.inactive]].map((s) => `<button class="${ui.userStatus === s[0] ? "seg on" : "seg"}" type="button" data-ustatus="${s[0]}">${s[1]} <b>${s[2]}</b></button>`).join("")}</div></div>`;
    const head = `<th class="ta-c">No</th>${sortTh("Nama")}${sortTh("NIK", "hs")}${sortTh("Email", "hs")}${sortTh("Departemen", "hs")}<th class="hs">Grup</th>${sortTh("Status")}<th class="ta-r">Aksi</th>`;
    const rows = list.length ? list.map((u, i) => `<tr class="${u.active ? "" : "row-danger"}"><td class="ta-c"><span class="row-no">${i + 1}</span></td><td><div class="who"><span class="av ${avatarClass(u.name)}">${initials(u.name)}</span><div><span class="who-line"><b>${esc(u.name)}</b></span><small>${esc(u.job)}</small></div></div></td><td class="mono hs">${esc(u.nik)}</td><td class="muted hs">${esc(u.email)}</td><td class="hs">${esc(u.department)} (${esc(u.code)})</td><td class="hs">${u.groups.length ? `<span class="grp-tags">${statusBadge("purple", "usersRound", u.groups[0])}</span>` : statusBadge("off", "circleDashed", "Belum ada")}</td><td>${u.active ? statusBadge("on", "circleCheck", "Aktif") : statusBadge("danger", "circleX", "Nonaktif")}</td><td class="ta-r">${rowAct(`Aksi untuk ${u.name}`)}</td></tr>`).join("") : `<tr><td colspan="8">${empty("Pengguna tidak ditemukan", "Coba ubah kata kunci atau filter.")}</td></tr>`;
    return tablePage("Manajemen Pengguna", "Kelola pengguna yang bisa masuk ke SSO Launcher.", "Tambah Pengguna", toolbar, head, rows, list.length, "pengguna");
  }

  function pageGroups() {
    const head = `<th class="ta-c">No</th>${sortTh("Nama Grup")}${sortTh("Departemen", "hs")}<th>Anggota</th><th class="hs">Aplikasi</th><th class="hs">Menu</th>${sortTh("Status")}<th class="ta-r">Aksi</th>`;
    const rows = db.groups.map((g, i) => `<tr><td class="ta-c"><span class="row-no">${i + 1}</span></td><td><div class="who"><span class="av ${avatarClass(g.name)}">${initials(g.name)}</span><div><span class="who-line"><b>${esc(g.name)}</b></span><small>${esc(g.department)}</small></div></div></td><td class="hs">${esc(g.department)}</td><td>${statusBadge("purple", "usersRound", `${g.members} anggota`)}</td><td class="hs">${statusBadge("info", "window", `${g.apps} aplikasi`)}</td><td class="hs">${statusBadge("teal", "list", `${g.menus} menu`)}</td><td>${statusBadge("on", "circleCheck", "Aktif")}</td><td class="ta-r">${rowAct(`Aksi untuk ${g.name}`)}</td></tr>`).join("");
    return tablePage("Manajemen Grup & Akses", "Atur anggota, akses aplikasi, dan akses menu setiap grup.", "Tambah Grup", "", head, rows, db.groups.length, "grup");
  }

  function pageApplications() {
    const head = `<th class="ta-c">No</th>${sortTh("Aplikasi")}${sortTh("Kategori", "hs")}<th class="hs">Slug</th><th>SSO</th>${sortTh("Status")}<th class="ta-r">Aksi</th>`;
    const rows = db.apps.map((a, i) => `<tr><td class="ta-c"><span class="row-no">${i + 1}</span></td><td><div class="who"><span class="av ${a.color}">${icon(a.icon, 18)}</span><div><span class="who-line"><b>${esc(a.name)}</b></span><small>${esc(a.description)}</small></div></div></td><td class="hs">${esc(a.category)}</td><td class="mono hs">${esc(a.slug)}</td><td>${a.usesSso ? statusBadge("on", "shieldCheck", "Terhubung") : statusBadge("off", "external", "Tanpa SSO")}</td><td>${a.status === "maintenance" ? statusBadge("warn", "wrench", "Maintenance") : statusBadge("on", "circleCheck", "Aktif")}</td><td class="ta-r">${rowAct(`Aksi untuk ${a.name}`)}</td></tr>`).join("");
    return tablePage("Manajemen Aplikasi", "Daftarkan aplikasi, atur status, dan kelola kredensial SSO.", "Tambah Aplikasi", "", head, rows, db.apps.length, "aplikasi");
  }

  function pageMenus() {
    const head = `<th class="ta-c">No</th><th>Menu</th><th>Bagian</th><th class="hs">Tujuan</th><th>Status</th>`;
    let n = 0;
    const rows = MENUS.flatMap((s) => s.items.map((m) => `<tr><td class="ta-c"><span class="row-no">${++n}</span></td><td><div class="who"><span class="av app-gy">${icon(m.icon, 18)}</span><div><span class="who-line"><b>${esc(m.label)}</b></span></div></div></td><td>${esc(s.section)}</td><td class="mono hs">/${m.key}</td><td>${statusBadge("on", "circleCheck", "Aktif")}</td></tr>`)).join("");
    return tablePage("Manajemen Menu", "Atur menu sidebar portal, urutan, dan mode perbaikan.", "", "", head, rows, n, "menu");
  }

  function pageAudit() {
    const head = `<th class="ta-c">No</th>${sortTh("Waktu")}${sortTh("Pengguna")}<th>Aksi</th><th class="hs">Data</th><th class="hs">Ringkasan</th>`;
    const rows = db.audit.map((x, i) => `<tr><td class="ta-c"><span class="row-no">${i + 1}</span></td><td class="mono">${esc(stamp(x.at))}</td><td><div class="who"><span class="av ${avatarClass(x.actor)}">${initials(x.actor)}</span><div><span class="who-line"><b>${esc(x.actor)}</b></span></div></div></td><td>${statusBadge(x.tone, x.tone === "danger" ? "circleX" : "circleCheck", x.action)}</td><td class="hs"><b>${esc(x.name)}</b><br><small class="muted">${esc(x.target)}</small></td><td class="muted hs">${esc(x.summary)}</td></tr>`).join("");
    return tablePage("Riwayat Aktivitas", "Semua login, perubahan data, dan aplikasi yang dibuka. Coba login dengan password salah, lalu lihat catatannya di sini.", "", "", head, rows, db.audit.length, "aktivitas");
  }

  function sidebar(route) {
    const sections = MENUS.filter((s) => !s.admin || me.admin);
    return `<aside class="sb" id="sidebar"><div class="sb-brand"><a class="brand brand-link" href="#/overview" aria-label="SSO Launcher, ke Beranda"><img class="brand-logo" src="${LOGO}" alt=""><span class="brand-text"><b>SSO<span>LAUNCHER</span></b><small>Portal akses aplikasi</small></span></a></div>
      <button class="sb-toggle" type="button" aria-label="Buka/tutup sidebar" data-act="collapse">${icon("chevronLeft", 14)}</button>
      <nav class="sb-nav" id="sbNav" aria-label="Navigasi utama">${sections.map((s) => `<div class="sb-section"><span class="sb-section-title">${s.section}</span>${s.items.map((m) => `<div class="sb-tree"><div class="sb-parent-row"><a class="nav${route === m.key ? " active" : ""}" href="#/${m.key}" ${route === m.key ? 'aria-current="page"' : ""} data-label="${m.label}">${icon(m.icon)}<span>${m.label}</span></a></div></div>`).join("")}</div>`).join("")}</nav>
      <div class="sb-foot"><small class="full">SSO Launcher + Access Control <i>·</i> v${VERSION}</small><small class="mini">v${VERSION}</small></div></aside>`;
  }

  function topbar() {
    const role = me.admin ? "Administrator" : me.department;
    return `<header class="tb"><div class="tb-brand"><a class="brand brand-link" href="#/overview" aria-label="SSO Launcher, ke Beranda"><img class="tb-logo" src="${LOGO}" alt=""><span class="tb-divider" aria-hidden="true"></span><span class="tb-brand-text"><b>SSO<span>LAUNCHER</span></b><small>Portal akses aplikasi</small></span></a></div>
      <div class="gs-wrap"><label class="search">${icon("search", 18)}<input id="globalSearch" placeholder="Cari aplikasi atau menu" autocomplete="off" data-input="global"><span class="gs-kbd" aria-hidden="true">Ctrl K</span></label></div>
      <div class="tb-right"><button class="icon-btn" type="button" aria-label="Notifikasi" data-pop="notif">${icon("bell", 22)}<i class="dot"></i></button>
      <button class="acct" type="button" aria-label="Menu akun" data-pop="account"><span class="av js-av ${avatarClass(me.name)}">${initials(me.name)}</span><span class="who-txt"><b class="js-name">${esc(me.name)}</b><small class="js-dept">${esc(role)}</small></span>${icon("chevronDown", 18)}</button></div></header>`;
  }

  function popover() {
    if (!ui.pop) return "";
    const btn = document.querySelector(`[data-pop="${ui.pop}"]`);
    const r = btn ? btn.getBoundingClientRect() : { bottom: 70, right: window.innerWidth - 20 };
    const width = ui.pop === "notif" ? 360 : 260;
    const style = `top:${r.bottom + 8}px;left:${Math.max(12, r.right - width)}px`;
    if (ui.pop === "account") {
      return `<div class="menu-pop" role="menu" style="${style}"><header class="acct-head"><span class="av ${avatarClass(me.name)}">${initials(me.name)}</span><div><b class="js-name">${esc(me.name)}</b><small class="js-email">${esc(me.email)}</small></div></header>
        <button class="mi" type="button" data-toast="Halaman Profil tersedia di aplikasi asli.">${icon("circleUser", 18)}Profil Saya</button><button class="mi" type="button" data-act="theme">${icon("settings", 18)}Ganti Tema</button><button class="mi danger" type="button" data-act="logout">${icon("logOut", 18)}Keluar</button></div>`;
    }
    return `<div class="menu-pop is-notifications" role="dialog" aria-label="Notifikasi" style="${style}"><header class="notif-head"><div><b>Notifikasi</b><small>1 belum dibaca</small></div></header><div style="padding:14px 16px;display:flex;gap:12px;align-items:flex-start"><span class="status info" style="flex:none">${icon("shieldCheck", 13)}Keamanan</span><div><b style="display:block;font-size:13px">Login dari perangkat baru</b><small class="muted">Chrome di Windows · ${rel(new Date(Date.now() - 2 * 60000).toISOString())}</small></div></div></div>`;
  }

  function loginView() {
    const points = [["usersRound", "Satu akun untuk semua aplikasi kerja"], ["shieldCheck", "Akses sesuai grup dan jabatan"], ["clock", "Sesi aman, keluar otomatis saat tidak aktif"]];
    return `<section class="lp" id="login"><div class="lp-visual"><div class="la"><div class="la-glow" aria-hidden="true"></div>${rings("la-rings")}<div class="la-stage"><div class="la-copy"><h2>Satu Akses untuk Semua Aplikasi.</h2><p>Masuk sekali, lalu buka aplikasi kerja Anda tanpa login ulang. Aman dan terpusat di SSO Launcher.</p><ul class="la-points">${points.map((p) => `<li><span>${icon(p[0], 17)}</span>${p[1]}</li>`).join("")}</ul><div class="la-brand"><img class="la-logo" src="${LOGO}" alt="Logo SSO Launcher"><span class="la-divider" aria-hidden="true"></span><div><b>SSO <span>LAUNCHER</span></b><small>PORTAL AKSES APLIKASI</small></div></div></div><div class="lb-art" aria-hidden="true">${SCENE}</div></div></div></div>
      <div class="lp-panel"><div class="lp-form"><span class="brand lp-logo"><img class="lp-logo-img" src="${LOGO}" alt="Logo SSO Launcher"><span class="lp-brand-text"><b>SSO<span>LAUNCHER</span></b><small>Portal akses aplikasi</small></span></span>
      <form class="lp-step" id="login-form" autocomplete="on" novalidate><h1 class="lp-title">Selamat Datang</h1><p class="lp-sub">Masuk dengan akun SSO Launcher Anda.</p>
      <label class="lp-label" for="email">Email</label><div class="lp-input${ui.loginError ? " has-error" : ""}"><svg viewBox="0 0 24 24" fill="none"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="Masukkan email"></div>
      <label class="lp-label" for="password">Password</label><div class="lp-input${ui.loginError ? " has-error" : ""}"><svg viewBox="0 0 24 24" fill="none"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password"><button type="button" class="lp-eye" aria-label="Tampilkan password" data-act="eye"><svg viewBox="0 0 24 24" fill="none"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      ${ui.loginError ? `<p class="lp-msg">${esc(ui.loginError)}</p>` : ""}
      <div class="lp-row"><label class="lp-check"><input id="remember" type="checkbox"><span class="lp-box"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5"/></svg></span>Ingat saya</label><a class="lp-forgot" href="#" data-toast="Hubungi Administrator Sistem untuk mengatur ulang password.">Lupa password?</a></div>
      <button type="submit" class="lp-submit">Masuk<svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button></form>
      <div class="demo-accounts"><h2>Akun demo · password ${PASSWORD}</h2>${db.users.filter((u) => u.id <= 2).map((u) => `<button type="button" class="demo-account" data-fill="${u.email}"><span><b>${u.admin ? "Administrator" : "Pengguna biasa"}</b><small>${esc(u.email)}</small></span><small>Isi otomatis</small></button>`).join("")}</div>
      <p class="lp-help">Butuh bantuan? Hubungi <a href="#" data-toast="Hubungi Administrator Sistem untuk bantuan akun.">Administrator Sistem</a></p></div><p class="lp-foot">© ${new Date().getFullYear()} Fedy Fs. Gerana · v${VERSION}</p></div></section>`;
  }

  function demoAppView(app, viaSso) {
    const payload = { userId: me.id, name: me.name, email: me.email, employeeNumber: me.nik, department: me.department, departemenCode: me.code, jobTitle: me.job, applicationSlug: app.slug, groups: me.groups, directAccess: false };
    return `<div class="demo-app"><div class="demo-app-bar ${app.color}"><div class="demo-app-brand"><span>${icon(app.icon, 20)}</span><div><b>${esc(app.name)}</b><br><small>Aplikasi contoh yang terhubung ke SSO Launcher</small></div></div><button type="button" data-act="app-logout">${icon("logOut", 16)}Keluar</button></div>
      <div class="demo-app-body"><section class="card"><h1>${viaSso ? `Halo, ${esc(me.name)}` : esc(app.name)}</h1><p>${viaSso ? `Anda masuk otomatis lewat SSO Launcher, tanpa mengisi email dan password lagi.` : "Aplikasi ini tidak memakai SSO, jadi di aplikasi asli Anda login dengan akun miliknya sendiri."}</p>
      ${viaSso ? `<ol class="demo-steps"><li>Portal menerbitkan <code>sso_token</code> (60 detik, sekali pakai) lalu mengalihkan browser ke <code>/sso/callback</code>.</li><li>Server aplikasi meminta token layanan dengan Client ID dan Client Secret.</li><li>Server aplikasi memvalidasi <code>sso_token</code> ke <code>POST /api/sso/validate</code> dan menerima data di bawah.</li><li>Aplikasi membuat sesinya sendiri. Logout di portal ikut mengakhiri sesi ini pada cek sesi berikutnya.</li></ol>` : ""}</section>
      ${viaSso ? `<section class="card"><h1 style="font-size:16px">Respons <code>POST /api/sso/validate</code></h1><p>Data pengguna yang diterima server aplikasi:</p><pre>${esc(JSON.stringify(payload, null, 2))}</pre></section>` : ""}</div></div>`;
  }

  function launch(app) {
    if (app.status !== "active") return toast(`${app.name} sedang maintenance.`, "warning");
    const stages = app.usesSso ? [
      ["Tahap 1 · Periksa akses", `Memeriksa akses ke ${app.name}`, "SSO Launcher memastikan akun Anda aktif dan berhak membuka aplikasi ini.", "GET /api/sso/launch → memeriksa sesi dan akses grup"],
      ["Tahap 2 · Terbitkan token", `Menyiapkan token untuk ${app.name}`, "Token dibuat khusus untuk aplikasi ini, berlaku 60 detik dan hanya sekali pakai.", "token: { berlaku 60 detik, sekali pakai }"],
      ["Tahap 3 · Kirim token", `Mengirim token ke ${app.name}`, "Aplikasi memvalidasi token ke SSO Launcher dari sisi server, tanpa perlu login ulang.", "POST /api/sso/validate → identitas pengguna"],
    ] : [
      ["Tahap 1 · Periksa akses", `Memeriksa akses ke ${app.name}`, "SSO Launcher memastikan akun Anda aktif dan berhak membuka aplikasi ini.", "GET /api/sso/launch → memeriksa sesi dan akses grup"],
      ["Tahap 2 · Tanpa SSO", `${app.name} tidak memakai SSO`, "Tidak ada token yang dikirim. Aplikasi ini memakai login miliknya sendiri.", "sso: tidak dipakai"],
      ["Tahap 3 · Buka aplikasi", `Membuka ${app.name}`, "Jika diminta, masuk dengan akun yang terdaftar di aplikasi tersebut.", "tab baru → halaman aplikasi"],
    ];
    overlay(stages, () => {
      const target = db.apps.find((a) => a.id === app.id);
      target.lastOpenedAt = new Date().toISOString();
      audit("Buka", "purple", "Aplikasi", app.name, app.usesSso ? "Membuka aplikasi lewat SSO" : "Membuka aplikasi tanpa SSO");
      location.hash = `#/app/${app.slug}`;
    });
  }

  function overlay(stages, done) {
    let step = 0;
    const paint = () => {
      const s = stages[step];
      layer.innerHTML = `<div class="launch show"><div class="launch-card"><div class="spin"></div><small>${esc(s[0])}</small><h3>${esc(s[1])}</h3><p>${esc(s[2])}</p><code>${esc(s[3])}</code></div></div>`;
    };
    paint();
    const tick = () => { step += 1; if (step < stages.length) { paint(); setTimeout(tick, 830); } else { layer.innerHTML = ""; done(); } };
    setTimeout(tick, 830);
  }

  function route() {
    const raw = (location.hash.replace(/^#\/?/, "") || "overview").split("?")[0];
    const parts = raw.split("/");
    return { page: parts[0], arg: parts[1] };
  }

  function syncBar() { document.documentElement.style.setProperty("--demo-bar-h", `${document.querySelector(".demo-bar").offsetHeight}px`); }
  window.addEventListener("resize", syncBar);
  syncBar();

  function render(animate = false) {
    document.body.classList.toggle("demo-still", !animate);
    const root = document.getElementById("root");
    if (!me) { root.innerHTML = loginView(); document.title = "Masuk — SSO Launcher (demo)"; document.getElementById("email")?.focus(); return; }
    const r = route();
    if (r.page === "app") {
      const app = db.apps.find((a) => a.slug === r.arg);
      if (app) { root.innerHTML = demoAppView(app, app.usesSso); document.title = `${app.name} — Aplikasi contoh`; return; }
    }
    const adminPages = ["users", "groups", "applications", "menus", "audit"];
    let page = r.page;
    if (adminPages.includes(page) && !me.admin) page = "overview";
    const views = { overview: pageOverview, "my-apps": () => pageMyApps("all"), favorites: () => pageMyApps("favorites"), recent: () => pageMyApps("recent"), users: pageUsers, groups: pageGroups, applications: pageApplications, menus: pageMenus, audit: pageAudit };
    if (!views[page]) page = "overview";
    root.innerHTML = `<div class="shell is-ready${ui.collapsed ? " is-collapsed" : ""}" id="shell">${sidebar(page)}<main class="main">${topbar()}<div id="page-slot"></div></main></div>`;
    document.getElementById("page-slot").outerHTML = views[page]();
    layer.innerHTML = popover();
    const label = MENUS.flatMap((s) => s.items).find((m) => m.key === page)?.label || "Beranda";
    document.title = `${label} — SSO Launcher (demo)`;
  }

  function rerenderFocus(selector) {
    const el = document.activeElement;
    const pos = el?.selectionStart;
    render();
    const next = document.querySelector(selector);
    if (next) { next.focus(); if (pos != null) next.setSelectionRange(pos, pos); }
  }

  document.addEventListener("submit", (e) => {
    if (e.target.id !== "login-form") return;
    e.preventDefault();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const user = db.users.find((u) => u.email === email);
    if (!email || !password) { ui.loginError = "Isi email dan password."; return render(); }
    if (!user || password !== PASSWORD) { db.audit.unshift({ at: new Date().toISOString(), actor: user ? user.name : email, action: "Login gagal", tone: "danger", target: "Login", name: email, summary: user ? "Password salah" : "Email tidak terdaftar" }); save(); ui.loginError = "Email atau password salah."; return render(); }
    if (!user.active) { ui.loginError = "Akun dinonaktifkan. Hubungi Administrator Sistem."; return render(); }
    me = user; ui.loginError = "";
    sessionStorage.setItem(SESSION, String(user.id));
    audit("Login", "on", "Login", user.email, "Login berhasil");
    if (location.hash === "#/overview") render(true); else location.hash = "#/overview";
  });

  document.addEventListener("click", (e) => {
    const el = e.target.closest("button, a");
    if (!el) { if (ui.pop && !e.target.closest(".menu-pop")) { ui.pop = null; layer.innerHTML = ""; } return; }
    const d = el.dataset;
    if (d.act === "toast-close") { el.closest(".toast")?.classList.remove("show", "to-interactive"); return; }
    if (d.toast) { e.preventDefault(); ui.pop = null; layer.innerHTML = ""; return toast(d.toast); }
    if (d.act === "theme") { const dark = document.documentElement.dataset.theme !== "dark"; if (dark) document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme; try { localStorage.setItem("sso-demo-theme", dark ? "dark" : "light"); } catch {} ui.pop = null; layer.innerHTML = ""; return; }
    if (d.act === "reset") { db = seed(); save(); me = null; sessionStorage.removeItem(SESSION); ui.pop = null; location.hash = "#/overview"; render(); return toast("Data demo dikembalikan seperti semula."); }
    if (d.fill) { document.getElementById("email").value = d.fill; document.getElementById("password").value = PASSWORD; document.getElementById("password").focus(); return; }
    if (d.act === "eye") { const p = document.getElementById("password"); p.type = p.type === "password" ? "text" : "password"; return; }
    if (!me) return;
    if (d.pop) { ui.pop = ui.pop === d.pop ? null : d.pop; layer.innerHTML = popover(); return; }
    if (ui.pop && !el.closest(".menu-pop")) { ui.pop = null; layer.innerHTML = ""; }
    if (d.act === "logout") { audit("Logout", "off", "Login", me.email, "Keluar dari portal"); me = null; sessionStorage.removeItem(SESSION); ui.pop = null; layer.innerHTML = ""; location.hash = "#/overview"; return render(); }
    if (d.act === "collapse") { ui.collapsed = !ui.collapsed; return render(); }
    if (d.act === "app-logout") {
      return overlay([
        ["Tahap 1 · Keluar dari aplikasi", "Mengakhiri sesi aplikasi", "Sesi di aplikasi sudah ditutup. SSO Launcher mencatat bahwa Anda keluar.", "POST /api/sso/sign-out → catat keluar"],
        ["Tahap 2 · Periksa sesi portal", "Memeriksa sesi SSO Launcher", "Sesi portal Anda masih aktif, jadi tidak perlu login ulang.", "POST /api/sso/session → aktif"],
        ["Tahap 3 · Kembali ke portal", "Kembali ke Beranda", "Anda kembali ke SSO Launcher.", "redirect → /overview"],
      ], () => { location.hash = "#/overview"; });
    }
    if (d.open) { const app = myApps().find((a) => a.id === Number(d.open)) || db.apps.find((a) => a.id === Number(d.open)); return launch(app); }
    if (d.fav) { const id = Number(d.fav); const on = me.favorites.includes(id); me.favorites = on ? me.favorites.filter((x) => x !== id) : [...me.favorites, id]; save(); render(); return toast(on ? "Dihapus dari favorit" : "Ditambahkan ke favorit"); }
    if (d.view) { const [k, v] = d.view.split(":"); if (k === "ma") ui.maView = v; else { ui.views[k] = v; ui.pages[k] = 0; } return render(); }
    if (d.tpage) { const [k, delta] = d.tpage.split(":"); ui.pages[k] += Number(delta); return render(); }
    if (d.page) { const [k, n] = d.page.split(":"); if (k === "ma") { ui.maPage = Number(n); render(); } return; }
    if (d.act === "reset-filter") { ui.q = ""; ui.cat = ""; render(); return toast("Filter diatur ulang"); }
    if (d.act === "reset-ma") { ui.maQ = ""; ui.maCat = ""; ui.maPage = 1; render(); return toast("Filter diatur ulang"); }
    if (d.ustatus !== undefined) { ui.userStatus = d.ustatus; return render(); }
  });

  document.addEventListener("input", (e) => {
    const k = e.target.dataset?.input;
    if (!k || k === "global" || k === "cat" || k === "maCat") return;
    ui[k] = e.target.value;
    if (k === "q") ui.pages.apps = 0;
    if (k === "maQ") ui.maPage = 1;
    rerenderFocus(`[data-input="${k}"]`);
  });
  document.addEventListener("change", (e) => {
    const k = e.target.dataset?.input;
    if (k === "cat" || k === "maCat") { ui[k] = e.target.value; ui.pages.apps = 0; ui.maPage = 1; render(); }
    if (e.target.dataset?.size === "ma") { ui.maSize = Number(e.target.value); ui.maPage = 1; render(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && ui.pop) { ui.pop = null; layer.innerHTML = ""; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); document.getElementById("globalSearch")?.focus(); }
    if (e.key === "Enter" && e.target.id === "globalSearch") {
      const kw = e.target.value.trim().toLowerCase();
      const app = me && myApps().find((a) => a.name.toLowerCase().includes(kw));
      if (kw && app) launch(app); else if (kw) toast("Tidak ada aplikasi yang cocok.", "warning");
    }
  });
  window.addEventListener("hashchange", () => { ui.pop = null; layer.innerHTML = ""; render(true); window.scrollTo({ top: 0 }); });
  let resizeTimer;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (me && route().page === "overview") render(); }, 150); });

  me = db.users.find((u) => u.id === Number(sessionStorage.getItem(SESSION))) || null;
  render(true);
})();
</script>
</body>
</html>
